[package]
name = "tauri-runtime-blitz"
description = "Tauri runtime backed by Blitz and Boa"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
anyrender_vello = { package = "ps-anyrender-vello", git = "https://github.com/pathscale/ps-anyrender.git", rev = "0e4122bff9220b85e4e462d1c3213c24beace3ea" }
anyrender_vello_hybrid = { package = "ps-anyrender-vello-hybrid", git = "https://github.com/pathscale/ps-anyrender.git", rev = "0e4122bff9220b85e4e462d1c3213c24beace3ea", optional = true }
blitz-dom = { package = "ps-blitz-dom", git = "https://github.com/pathscale/ps-blitz.git", rev = "464444a2a2708afea65f89c38d2f4908cda89af9", optional = true }
blitz-script = { package = "ps-blitz-script", git = "https://github.com/pathscale/ps-blitz.git", rev = "464444a2a2708afea65f89c38d2f4908cda89af9", features = ["system-fonts"] }
blitz-control-protocol = { path = "../blitz-control-protocol", optional = true }
blitz-shell = { package = "ps-blitz-shell", git = "https://github.com/pathscale/ps-blitz.git", rev = "464444a2a2708afea65f89c38d2f4908cda89af9", default-features = false, features = ["clipboard", "svg"] }
blitz-traits = { package = "ps-blitz-traits", git = "https://github.com/pathscale/ps-blitz.git", rev = "464444a2a2708afea65f89c38d2f4908cda89af9", optional = true }
http = "1"
endpoint-libs = { version = "2.1.5", default-features = false, features = ["agent-control"], optional = true }
keyboard-types = { version = "0.7", optional = true }
raw-window-handle = "0.6"
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
tauri = { version = "=2.11.5", default-features = false }
tauri-runtime = "=2.11.3"
tauri-utils = "=2.9.3"
url = "2"
winit = "=0.31.0-beta.2"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt", "sync"], optional = true }

[features]
default = ["agent-control"]
agent-control = ["dep:blitz-control-protocol", "dep:blitz-dom", "dep:blitz-traits", "dep:endpoint-libs", "dep:keyboard-types", "dep:serde", "dep:serde_json", "dep:tokio"]
debug-control = ["blitz-script/debug-control", "blitz-shell/debug-control"]
diagnostics = ["agent-control", "debug-control"]
# Swap the general-purpose Vello renderer for the lighter hybrid pipeline.
# UI is overwhelmingly rectangles and text, which Vello tessellates and bins
# through a compute pass built for arbitrary vector art. The hybrid backend
# does far less per primitive, which is the same bet GPUI makes.
hybrid-renderer = ["dep:anyrender_vello_hybrid"]
devtools = ["tauri-runtime/devtools"]
macos-private-api = []

[dev-dependencies]
tauri = { version = "=2.11.5", default-features = false, features = ["test"] }
