[package]
name = "tauri-runtime-blitz"
description = "Tauri runtime backed by Blitz and Boa"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
anyrender_vello = { git = "https://github.com/pathscale/ps-anyrender.git", rev = "36b1fffb41104451ac0de763862a60137d9348b1" }
blitz-script = { git = "https://github.com/pathscale/ps-blitz.git", rev = "30faf47191530dac80e4ddeec77174a41184a729", features = ["system-fonts"] }
blitz-shell = { git = "https://github.com/pathscale/ps-blitz.git", rev = "30faf47191530dac80e4ddeec77174a41184a729", default-features = false, features = ["clipboard", "svg"] }
http = "1"
raw-window-handle = "0.6"
tauri = { version = "=2.11.5", default-features = false }
tauri-runtime = "=2.11.3"
tauri-utils = "=2.9.3"
url = "2"
winit = "=0.31.0-beta.2"

[features]
debug-control = ["blitz-script/debug-control", "blitz-shell/debug-control"]
devtools = ["tauri-runtime/devtools"]
macos-private-api = []

[dev-dependencies]
blitz-dom = { git = "https://github.com/pathscale/ps-blitz.git", rev = "30faf47191530dac80e4ddeec77174a41184a729" }
serde_json = "1"
tauri = { version = "=2.11.5", default-features = false, features = ["test"] }
