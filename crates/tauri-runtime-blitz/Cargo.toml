[package]
name = "tauri-runtime-blitz"
description = "Tauri runtime backed by Blitz and Boa"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
anyrender_vello = { path = "../../../anyrender/crates/anyrender_vello" }
blitz-script = { path = "../../../blitz-rust/packages/blitz-script", features = ["system-fonts"] }
blitz-shell = { path = "../../../blitz-rust/packages/blitz-shell", default-features = false, features = ["clipboard", "svg"] }
http = "1"
raw-window-handle = "0.6"
tauri = { version = "=2.11.5", default-features = false }
tauri-runtime = "=2.11.3"
tauri-utils = "=2.9.3"
url = "2"
winit = "=0.31.0-beta.2"

[features]
debug-control = ["blitz-script/debug-control", "blitz-shell/debug-control"]
devtools = ["tauri-runtime/devtools"]
macos-private-api = []

[dev-dependencies]
blitz-dom = { path = "../../../blitz-rust/packages/blitz-dom" }
serde_json = "1"
tauri = { version = "=2.11.5", default-features = false, features = ["test"] }
