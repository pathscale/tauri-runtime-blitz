name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  protocol:
    name: Protocol (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy -p blitz-control-protocol --all-targets -- -D warnings
      - name: Test
        run: cargo test -p blitz-control-protocol --locked
      - name: Package protocol
        run: cargo package -p blitz-control-protocol --locked

  runtime:
    name: Runtime (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-14, macos-26]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: cargo clippy -p tauri-runtime-blitz --all-targets --all-features -- -D warnings
      - name: Test
        # Runtime debug switches and sampling sessions are process-global by
        # design, so their tests must not mutate that state concurrently.
        run: cargo test -p tauri-runtime-blitz --all-features --locked -- --test-threads=1
      - name: Verify Liquid Glass class
        if: ${{ matrix.runner == 'macos-26' }}
        run: >-
          cargo test -p tauri-runtime-blitz --all-features --locked
          liquid_glass_class_is_available -- --ignored
