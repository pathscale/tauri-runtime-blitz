name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  protocol:
    name: Protocol (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy -p blitz-control-protocol --all-targets -- -D warnings
      - name: Test
        run: cargo test -p blitz-control-protocol
      - name: Package protocol
        run: cargo package -p blitz-control-protocol

  runtime:
    name: Runtime (macOS)
    # The organisation's macOS profile rather than a GitHub-hosted version.
    # Pinning a version meant the matrix carried an older runner that may never
    # be exercised again, and a check expected to be red is one nobody reads.
    runs-on: namespace-profile-agency-tahoe
    timeout-minutes: 30
    defaults:
      run:
        shell: zsh -eo pipefail {0}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: cargo clippy -p tauri-runtime-blitz --all-targets --all-features -- -D warnings
      - name: Test
        # Runtime debug switches and sampling sessions are process-global by
        # design, so their tests must not mutate that state concurrently.
        run: cargo test -p tauri-runtime-blitz --all-features -- --test-threads=1
      - name: Verify Liquid Glass class
        run: >-
          cargo test -p tauri-runtime-blitz --all-features
          liquid_glass_class_is_available -- --ignored
