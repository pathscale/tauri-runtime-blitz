name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  protocol:
    name: Protocol dependency (Linux)
    runs-on: ubicloud-standard-2
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Verify protocol ownership and compatible dependency
        run: |
          test ! -e crates/blitz-control-protocol
          cargo tree -p tauri-runtime-blitz --features agent-control \
            -i blitz-control-protocol
      - name: Package the runtime without workspace-only dependencies
        run: cargo package -p tauri-runtime-blitz --no-verify

  runtime:
    name: Runtime (macOS)
    # Manual only. macOS runners are for building packages, not for routine
    # checks: they are the expensive capacity, and running them on every push
    # spends it on work Linux can do. Everything this job asserts about the
    # crate is asserted on Linux by `protocol` and `headless`; what is left is
    # the window runtime itself, which only matters when a release is being cut.
    #
    # `workflow_dispatch` to run it deliberately.
    if: ${{ github.event_name == 'workflow_dispatch' }}
    # The organisation's macOS profile rather than a GitHub-hosted version.
    # Pinning a version meant the matrix carried an older runner that may never
    # be exercised again, and a check expected to be red is one nobody reads.
    runs-on: namespace-profile-agency-tahoe
    timeout-minutes: 30
    defaults:
      run:
        shell: zsh -eo pipefail {0}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Clippy
        run: cargo clippy -p tauri-runtime-blitz --all-targets --all-features -- -D warnings
      - name: Test
        # Runtime debug switches and sampling sessions are process-global by
        # design, so their tests must not mutate that state concurrently.
        run: cargo test -p tauri-runtime-blitz --all-features -- --test-threads=1
      - name: Verify publishable package
        run: cargo package -p tauri-runtime-blitz
      - name: Verify Liquid Glass class
        run: >-
          cargo test -p tauri-runtime-blitz --all-features
          liquid_glass_class_is_available -- --ignored

  # The headless surface, built without the Tauri runtime.
  #
  # This is the configuration a QA host uses, and it is the one that has to keep
  # working on a machine with no window system at all. Checking it here is what
  # stops a window-only type drifting back into `agent.rs` and reintroducing the
  # dependency this feature exists to remove.
  headless:
    name: Headless surface (no runtime)
    runs-on: ubicloud-standard-2
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      # Fontconfig, because a renderer needs fonts wherever it runs. That is not
      # a window stack, and nothing here installs GTK or webkit: the graph check
      # below is what holds that line.
      - name: Fontconfig
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libfontconfig-dev
      - name: Clippy
        run: |
          cargo clippy -p tauri-runtime-blitz \
            --no-default-features --features agent-control -- -D warnings
      # Renderers as well as window stacks. This checked for `tauri`, GTK and
      # WebKit and passed while the headless build linked wgpu, two versions of
      # vello, naga and wgpu-hal: `anyrender_vello` was a hard dependency, so
      # the only consumers who could reach it were the ones that could never
      # use it. `mod runtime` is the sole user and was already behind the
      # `runtime` feature, so nothing but the manifest had to change.
      #
      # `ps-anyrender-vello-cpu` is deliberately not banned. It arrives through
      # `blitz-script` behind `debug-control`, which is what serves the
      # `screenshot` endpoint, and rasterising is what that endpoint is for.
      # Whether a pure inspection host should offer it at all is a separate
      # question; this check is about not linking a GPU stack by accident.
      #
      # The target is pinned rather than inherited, so the answer does not
      # depend on which runner this lands on.
      - name: No window stack or GPU renderer in the graph
        run: |
          found=$(cargo tree -p tauri-runtime-blitz --edges normal \
            --target x86_64-unknown-linux-gnu \
            --no-default-features --features agent-control \
            | grep -ciE 'tauri v|gtk|glib|webkit|soup|wgpu|naga|ps-vello v|anyrender-vello v' || true)
          if [ "$found" != "0" ]; then
            echo "the headless build pulled in $found window-stack or renderer crates" >&2
            cargo tree -p tauri-runtime-blitz --edges normal \
              --target x86_64-unknown-linux-gnu \
              --no-default-features --features agent-control \
              | grep -iE 'tauri v|gtk|glib|webkit|soup|wgpu|naga|ps-vello v|anyrender-vello v' >&2 || true
            exit 1
          fi
