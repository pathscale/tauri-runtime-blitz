name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  protocol:
    name: Protocol dependency (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Verify protocol ownership and compatible dependency
        run: |
          test ! -e crates/blitz-control-protocol
          cargo tree -p tauri-runtime-blitz --features agent-control \
            -i blitz-control-protocol
      - name: Package the runtime without workspace-only dependencies
        run: cargo package -p tauri-runtime-blitz --no-verify
      # Tauri on Linux is GTK, so the crate cannot even be type-checked here
      # without its development headers.
      - name: GTK development headers
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libglib2.0-dev libgtk-3-dev libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev librsvg2-dev libsoup-3.0-dev
      # This job named Linux and never compiled anything for it: `cargo tree`
      # resolves without building and `cargo package --no-verify` skips the
      # build by definition. So the crate stopped compiling on Linux and every
      # check here stayed green, and it surfaced in a consumer instead, as four
      # errors inside a dependency nobody had edited.
      - name: Compile the runtime for Linux
        run: cargo check -p tauri-runtime-blitz --features agent-control

  runtime:
    name: Runtime (macOS)
    # The organisation's macOS profile rather than a GitHub-hosted version.
    # Pinning a version meant the matrix carried an older runner that may never
    # be exercised again, and a check expected to be red is one nobody reads.
    runs-on: namespace-profile-agency-tahoe
    timeout-minutes: 30
    defaults:
      run:
        shell: zsh -eo pipefail {0}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Clippy
        run: cargo clippy -p tauri-runtime-blitz --all-targets --all-features -- -D warnings
      - name: Test
        # Runtime debug switches and sampling sessions are process-global by
        # design, so their tests must not mutate that state concurrently.
        run: cargo test -p tauri-runtime-blitz --all-features -- --test-threads=1
      - name: Verify publishable package
        run: cargo package -p tauri-runtime-blitz
      - name: Verify Liquid Glass class
        run: >-
          cargo test -p tauri-runtime-blitz --all-features
          liquid_glass_class_is_available -- --ignored
