name: Publish crates

on:
  push:
    branches: [master]
    paths:
      - Cargo.toml
      - crates/blitz-control-protocol/Cargo.toml
      - crates/tauri-runtime-blitz/Cargo.toml
      - .github/workflows/publish.yml
  workflow_dispatch:
    inputs:
      version:
        description: 'Workspace version to publish, without v'
        required: true
        type: string

concurrency:
  group: publish-crates
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

jobs:
  publish:
    name: Publish ordered crates
    # The runtime is macOS-only. Verifying its package on Ubuntu pulls Tauri's
    # GTK backend and fails before publication on missing system GLib.
    runs-on: namespace-profile-agency-tahoe
    timeout-minutes: 30
    defaults:
      run:
        shell: zsh -eo pipefail {0}
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      - name: Verify requested version
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
          RELEASE_KIND: ${{ github.event_name }}
        run: |
          workspace_version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)"
          if [ "$RELEASE_KIND" = workflow_dispatch ]; then
            requested="$REQUESTED_VERSION"
          else
            requested="$workspace_version"
          fi
          if [ "$requested" != "$workspace_version" ]; then
            echo "requested $requested but workspace is $workspace_version" >&2
            exit 1
          fi

      # A failed run may publish the protocol before the runtime. Treat each
      # crate independently so re-running safely completes that partial release.
      - name: Check registry state
        id: registry
        run: |
          version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)"
          for package in blitz-control-protocol tauri-runtime-blitz; do
            published="$(curl -sS -H 'User-Agent: pathscale-ci' \
              "https://crates.io/api/v1/crates/$package/versions" \
              | jq -r --arg version "$version" \
                '.versions[]? | select(.num == $version) | .num')"
            key="${package//-/_}"
            if [ -n "$published" ]; then
              echo "$key=true" >> "$GITHUB_OUTPUT"
            else
              echo "$key=false" >> "$GITHUB_OUTPUT"
            fi
          done

      - name: Verify protocol package
        if: steps.registry.outputs.blitz_control_protocol == 'false'
        run: cargo package -p blitz-control-protocol

      - name: Publish protocol
        if: steps.registry.outputs.blitz_control_protocol == 'false'
        run: cargo publish -p blitz-control-protocol

      - name: Wait for protocol index
        run: |
          version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)"
          for _ in $(seq 1 30); do
            if cargo info "blitz-control-protocol@$version" >/dev/null 2>&1; then
              exit 0
            fi
            sleep 10
          done
          echo "blitz-control-protocol $version did not reach the registry index" >&2
          exit 1

      - name: Verify runtime package
        if: steps.registry.outputs.tauri_runtime_blitz == 'false'
        run: cargo package -p tauri-runtime-blitz

      - name: Publish runtime
        if: steps.registry.outputs.tauri_runtime_blitz == 'false'
        run: cargo publish -p tauri-runtime-blitz
