name: Publish crates

on:
  push:
    branches: [master]
    paths:
      - Cargo.toml
      - crates/tauri-runtime-blitz/Cargo.toml
      - .github/workflows/publish.yml
  workflow_dispatch:
    inputs:
      version:
        description: 'Workspace version to publish, without v'
        required: true
        type: string

concurrency:
  group: publish-crates
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    name: Publish runtime
    # The runtime is macOS-only. Verifying its package on Ubuntu pulls Tauri's
    # GTK backend and fails before publication on missing system GLib.
    runs-on: namespace-profile-agency-tahoe
    timeout-minutes: 30
    defaults:
      run:
        shell: zsh -eo pipefail {0}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Verify requested version
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
          RELEASE_KIND: ${{ github.event_name }}
        run: |
          workspace_version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)"
          if [ "$RELEASE_KIND" = workflow_dispatch ]; then
            requested="$REQUESTED_VERSION"
          else
            requested="$workspace_version"
          fi
          if [ "$requested" != "$workspace_version" ]; then
            echo "requested $requested but workspace is $workspace_version" >&2
            exit 1
          fi

      - name: Check registry state
        id: registry
        run: |
          version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)"
          published="$(curl -sS -H 'User-Agent: pathscale-ci' \
            "https://crates.io/api/v1/crates/tauri-runtime-blitz/versions" \
            | jq -r --arg version "$version" \
              '.versions[]? | select(.num == $version) | .num')"
          if [ -n "$published" ]; then
            echo "tauri_runtime_blitz=true" >> "$GITHUB_OUTPUT"
          else
            echo "tauri_runtime_blitz=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify runtime package
        if: steps.registry.outputs.tauri_runtime_blitz == 'false'
        run: cargo package -p tauri-runtime-blitz

      - name: Publish runtime
        if: steps.registry.outputs.tauri_runtime_blitz == 'false'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish -p tauri-runtime-blitz
