name: Publish crates

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Workspace version to publish, without v'
        required: true
        type: string

concurrency:
  group: publish-crates
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

jobs:
  publish:
    name: Publish ordered crates
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Verify requested version
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
          RELEASE_REF: ${{ github.ref_name }}
          RELEASE_KIND: ${{ github.event_name }}
        run: |
          workspace_version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)"
          if [ "$RELEASE_KIND" = push ]; then
            requested="${RELEASE_REF#v}"
          else
            requested="$REQUESTED_VERSION"
          fi
          if [ "$requested" != "$workspace_version" ]; then
            echo "requested $requested but workspace is $workspace_version" >&2
            exit 1
          fi

      - name: Verify packages
        run: cargo package -p blitz-control-protocol --locked

      - name: Publish protocol
        run: cargo publish -p blitz-control-protocol --locked

      - name: Wait for protocol index
        run: |
          version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)"
          for _ in $(seq 1 30); do
            if cargo info "blitz-control-protocol@$version" >/dev/null 2>&1; then
              exit 0
            fi
            sleep 10
          done
          echo "blitz-control-protocol $version did not reach the registry index" >&2
          exit 1

      - name: Publish runtime
        run: |
          cargo package -p tauri-runtime-blitz --locked
          cargo publish -p tauri-runtime-blitz --locked
